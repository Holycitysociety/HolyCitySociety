<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Holy City Society</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="site-header site-shell">
    <nav class="top-nav" aria-label="Primary">
      <a href="./index.html" aria-current="page">Praxis</a>
      <a href="./virtues.html">Energeia</a>
    </nav>

    <div class="site-name" aria-label="Holy City Society">
      <span class="site-cross" aria-hidden="true">✠</span>
      <span>Holy City Society</span>
      <span class="site-cross" aria-hidden="true">✠</span>
    </div>
  </header>

  <main class="site-shell">
    <section class="hero" aria-labelledby="formal-title">
      <div
        class="hero-art"
        role="img"
        aria-label="Blue engraved city on a hill with mounted riders"
      ></div>

      <div class="hero-copy">
        <div
          class="bilingual-wordmark"
          aria-label="Societas atque Ordo Equestris Civitatis Sanctae. The Society and Equestrian Order of the Holy City."
        >
          <p class="formal-title formal-latin">
            <span class="title-line">
              <span class="fit-text">Societas atque</span>
            </span>

            <span class="title-line">
              <span class="fit-text">Ordo Equestris</span>
            </span>

            <span class="title-line">
              <span class="fit-text">Civitatis Sanctae</span>
            </span>
          </p>

          <h1 class="formal-title formal-english" id="formal-title">
            <span class="title-line">
              <span class="fit-text">The Society &amp;</span>
            </span>

            <span class="title-line">
              <span class="fit-text">Equestrian Order</span>
            </span>

            <span class="title-line">
              <span class="fit-text">of the Holy City</span>
            </span>
          </h1>
        </div>

        <p class="mission equal-size-group">
          <span class="equal-size-line">
            Continuing the quest to build
          </span>

          <span class="equal-size-line">
            an illuminated, free, and holy society
          </span>
        </p>

        <blockquote class="scripture">
          <p class="equal-size-group">
            <span class="equal-size-line">
              “Ye are the light of the world.
            </span>

            <span class="equal-size-line">
              A city that is set on a hill cannot be hid.”
            </span>
          </p>

          <cite>Matthew 5:14</cite>
        </blockquote>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const referenceFontSize = 100;
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      function numericCustomProperty(element, propertyName, fallback) {
        const value = Number.parseFloat(
          getComputedStyle(element).getPropertyValue(propertyName)
        );

        return Number.isFinite(value) ? value : fallback;
      }

      function transformedText(element) {
        const text = element.textContent.trim();
        const transform = getComputedStyle(element).textTransform;

        if (transform === "uppercase") {
          return text.toUpperCase();
        }

        if (transform === "lowercase") {
          return text.toLowerCase();
        }

        return text;
      }

      function measureTextAtReferenceSize(element) {
        const styles = getComputedStyle(element);
        const text = transformedText(element);

        const fontStyle = styles.fontStyle || "normal";
        const fontVariant = styles.fontVariant || "normal";
        const fontWeight = styles.fontWeight || "400";
        const fontFamily = styles.fontFamily || "serif";

        context.font =
          `${fontStyle} ${fontVariant} ${fontWeight} ` +
          `${referenceFontSize}px ${fontFamily}`;

        const glyphWidth = context.measureText(text).width;

        const trackingEm = numericCustomProperty(
          element,
          "--tracking-em",
          0
        );

        const wordSpacingEm = numericCustomProperty(
          element,
          "--word-spacing-em",
          0
        );

        const characterGaps = Math.max(text.length - 1, 0);
        const spaces = (text.match(/\s/g) || []).length;

        const trackingWidth =
          trackingEm * referenceFontSize * characterGaps;

        const additionalWordSpacing =
          wordSpacingEm * referenceFontSize * spaces;

        return (
          glyphWidth +
          trackingWidth +
          additionalWordSpacing
        );
      }

      function fitFormalLine(element) {
        const line = element.closest(".title-line");
        const targetWidth = Math.max(line.clientWidth - 2, 0);

        if (targetWidth <= 0) {
          return;
        }

        const referenceWidth = measureTextAtReferenceSize(element);

        if (referenceWidth <= 0) {
          return;
        }

        const minimumSize = numericCustomProperty(
          element,
          "--minimum-fit-size",
          10
        );

        const maximumSize = numericCustomProperty(
          element,
          "--maximum-fit-size",
          180
        );

        const calculatedSize =
          referenceFontSize * (targetWidth / referenceWidth);

        const finalSize = Math.max(
          minimumSize,
          Math.min(calculatedSize, maximumSize)
        );

        element.style.fontSize = `${finalSize}px`;
      }

      function fitEqualSizeGroup(group) {
        const lines = Array.from(
          group.querySelectorAll(".equal-size-line")
        );

        if (!lines.length) {
          return;
        }

        const targetWidth = Math.max(group.clientWidth - 2, 0);

        if (targetWidth <= 0) {
          return;
        }

        const longestReferenceWidth = Math.max(
          ...lines.map(measureTextAtReferenceSize)
        );

        if (longestReferenceWidth <= 0) {
          return;
        }

        const minimumSize = numericCustomProperty(
          group,
          "--minimum-group-size",
          10
        );

        const maximumSize = numericCustomProperty(
          group,
          "--maximum-group-size",
          72
        );

        const calculatedSize =
          referenceFontSize *
          (targetWidth / longestReferenceWidth);

        const finalSize = Math.max(
          minimumSize,
          Math.min(calculatedSize, maximumSize)
        );

        lines.forEach((line) => {
          line.style.fontSize = `${finalSize}px`;
        });
      }

      function fitAllTypography() {
        document
          .querySelectorAll(".fit-text")
          .forEach(fitFormalLine);

        document
          .querySelectorAll(".equal-size-group")
          .forEach(fitEqualSizeGroup);
      }

      let resizeFrame;

      function scheduleFit() {
        window.cancelAnimationFrame(resizeFrame);

        resizeFrame =
          window.requestAnimationFrame(fitAllTypography);
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(scheduleFit);
      } else {
        window.addEventListener("load", scheduleFit);
      }

      window.addEventListener("resize", scheduleFit);
      window.addEventListener("orientationchange", scheduleFit);
    })();
  </script>
</body>
</html>
