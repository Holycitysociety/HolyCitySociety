<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Holy City Society</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="site-header site-shell">
    <nav class="top-nav" aria-label="Primary">
      <a href="./index.html" aria-current="page">Praxis</a>
      <a href="./virtues.html">Energeia</a>
    </nav>

    <div class="site-name" aria-label="Holy City Society">
      <span class="site-cross" aria-hidden="true">✠</span>
      <span>Holy City Society</span>
      <span class="site-cross" aria-hidden="true">✠</span>
    </div>
  </header>

  <main class="site-shell">
    <section class="hero" aria-labelledby="formal-title">
      <div
        class="hero-art"
        role="img"
        aria-label="Blue engraved city on a hill with mounted riders"
      ></div>

      <div class="hero-copy">
        <div
          class="bilingual-wordmark"
          aria-label="Societas et Ordo Equestris Civitatis Sanctae. The Society and Equestrian Order of the Holy City."
        >
          <p class="formal-title formal-latin">
            <span class="title-line fitted-title-line">
              Societas et
            </span>

            <span class="title-line fitted-title-line">
              Ordo Equestris
            </span>

            <span class="title-line fitted-title-line">
              Civitatis Sanctae
            </span>
          </p>

          <h1 class="formal-title formal-english" id="formal-title">
            <span class="title-line fitted-title-line">
              The Society &amp;
            </span>

            <span class="title-line fitted-title-line">
              Equestrian Order of
            </span>

            <span class="title-line fitted-title-line">
              The Holy City
            </span>
          </h1>
        </div>

        <p class="mission">
          Continuing the quest to build an illuminated, free, and holy society
        </p>

        <blockquote class="scripture">
          <p>
            “Ye are the light of the world. A city that is set on a hill cannot be hid.”
          </p>

          <cite>Matthew 5:14</cite>
        </blockquote>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const lineSelector = ".fitted-title-line";
      let resizeFrame;

      function readNumber(element, property, fallback) {
        const value = Number.parseFloat(
          getComputedStyle(element).getPropertyValue(property)
        );

        return Number.isFinite(value) ? value : fallback;
      }

      function countCharacterGaps(text) {
        const characters = Array.from(text.trim());
        return Math.max(characters.length - 1, 1);
      }

      function measureNaturalWidth(line, fontSize) {
        line.style.fontSize = `${fontSize}px`;
        line.style.letterSpacing = "0px";

        return line.getBoundingClientRect().width;
      }

      function fitLine(line) {
        const title = line.closest(".formal-title");
        const targetWidth = line.clientWidth;

        if (!title || targetWidth <= 0) {
          return;
        }

        const minimumSize = readNumber(
          title,
          "--minimum-line-size",
          16
        );

        const maximumSize = readNumber(
          title,
          "--maximum-line-size",
          64
        );

        /*
          The font first fills this proportion of the line.
          Letter spacing supplies the final portion.
        */
        const naturalFill = readNumber(
          title,
          "--natural-fill",
          0.94
        );

        const maximumTrackingEm = readNumber(
          title,
          "--maximum-tracking",
          0.14
        );

        const desiredNaturalWidth = targetWidth * naturalFill;

        line.style.fontSize = "";
        line.style.letterSpacing = "0px";

        let low = minimumSize;
        let high = maximumSize;
        let fittedSize = minimumSize;

        /*
          Find the largest font size whose untracked text remains
          within the desired natural-width proportion.
        */
        for (let iteration = 0; iteration < 28; iteration += 1) {
          const testSize = (low + high) / 2;
          const measuredWidth = measureNaturalWidth(line, testSize);

          if (measuredWidth <= desiredNaturalWidth) {
            fittedSize = testSize;
            low = testSize;
          } else {
            high = testSize;
          }
        }

        line.style.fontSize = `${fittedSize}px`;
        line.style.letterSpacing = "0px";

        let naturalWidth = line.getBoundingClientRect().width;
        const text = line.textContent.trim();
        const characterGaps = countCharacterGaps(text);

        let requiredTracking =
          (targetWidth - naturalWidth) / characterGaps;

        const maximumTracking =
          fittedSize * maximumTrackingEm;

        /*
          If the line reached its maximum size and still needs
          excessive tracking, allow the font to grow enough to keep
          the tracking elegant while maintaining the square edge.
        */
        if (requiredTracking > maximumTracking) {
          const widthNeededFromType =
            targetWidth - maximumTracking * characterGaps;

          const scale =
            naturalWidth > 0
              ? widthNeededFromType / naturalWidth
              : 1;

          fittedSize *= Math.max(scale, 1);

          line.style.fontSize = `${fittedSize}px`;
          line.style.letterSpacing = "0px";

          naturalWidth = line.getBoundingClientRect().width;

          requiredTracking =
            (targetWidth - naturalWidth) / characterGaps;
        }

        line.style.letterSpacing =
          `${Math.max(requiredTracking, 0)}px`;
      }

      function fitWordmark() {
        document.querySelectorAll(lineSelector).forEach(fitLine);
      }

      function scheduleFit() {
        window.cancelAnimationFrame(resizeFrame);

        resizeFrame = window.requestAnimationFrame(() => {
          fitWordmark();
        });
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(scheduleFit);
      } else {
        window.addEventListener("load", scheduleFit);
      }

      window.addEventListener("resize", scheduleFit);

      const wordmark =
        document.querySelector(".bilingual-wordmark");

      if ("ResizeObserver" in window && wordmark) {
        const observer = new ResizeObserver(scheduleFit);
        observer.observe(wordmark);
      }
    })();
  </script>
</body>
</html>
