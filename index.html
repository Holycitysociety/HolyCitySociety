<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Holy City Society</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="site-shell">
      <nav class="top-nav" aria-label="Primary">
        <a href="./index.html" aria-current="page">Praxis</a>
        <a href="./virtues.html">Energeia</a>
      </nav>

      <div
        class="header-lockup"
        aria-label="Societas et Ordo Equestris Civitatis Sanctae. The Society and Equestrian Order of the Holy City."
      >
        <p class="header-latin">
          <span class="latin-line">Societas et</span>
          <span class="latin-line">Ordo Equestris Civitatis Sanctae</span>
        </p>

        <div class="formal-divider" aria-hidden="true">
          <span class="divider-cross">✠</span>
          <span class="divider-line"></span>
          <span class="divider-cross">✠</span>
        </div>

        <h1 class="header-english">
          The Society and Equestrian Order of the Holy City
        </h1>
      </div>
    </div>
  </header>

  <main class="site-shell">
    <section class="hero" aria-labelledby="mission-title">
      <div
        class="hero-art"
        role="img"
        aria-label="Blue engraved city on a hill with mounted riders"
      ></div>

      <div class="hero-copy">
        <div class="mission-panel">
          <h2 class="visually-hidden" id="mission-title">Mission</h2>

          <p class="mission">
            Continuing the quest to build an illuminated, free, and holy society
          </p>

          <blockquote class="scripture">
            <p>
              “Ye are the light of the world. A city that is set on a hill cannot be hid.”
            </p>
            <cite>Matthew 5:14</cite>
          </blockquote>
        </div>
      </div>
    </section>
  </main>
