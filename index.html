<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Holy City Society</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="site-header site-shell">
    <nav class="top-nav" aria-label="Primary">
      <a href="./index.html" aria-current="page">Praxis</a>
      <a href="./virtues.html">Energeia</a>
    </nav>

    <div class="site-name" aria-label="Holy City Society">
      <span class="site-cross" aria-hidden="true">✠</span>
      <span>Holy City Society</span>
      <span class="site-cross" aria-hidden="true">✠</span>
    </div>
  </header>

  <main class="site-shell">
    <section class="hero" aria-labelledby="formal-title">
      <div
        class="hero-art"
        role="img"
        aria-label="Blue engraved city on a hill with mounted riders"
      ></div>

      <div class="hero-copy">
        <div
          class="bilingual-wordmark"
          aria-label="Societas et Ordo Equestris Civitatis Sanctae. The Society and Equestrian Order of the Holy City."
        >
          <p class="formal-title formal-latin">
            <span class="title-line fitted-title-line">
              <span class="opening-cross" aria-hidden="true">✠</span>
              Societas et
            </span>

            <span class="title-line fitted-title-line">
              Ordo Equestris
            </span>

            <span class="title-line fitted-title-line">
              Civitatis Sanctae
            </span>
          </p>

          <h1 class="formal-title formal-english" id="formal-title">
            <span class="title-line fitted-title-line">
              The Society &amp;
            </span>

            <span class="title-line fitted-title-line">
              Equestrian Order of
            </span>

            <span class="title-line fitted-title-line">
              The Holy City
            </span>
          </h1>
        </div>

        <p class="mission">
          Continuing the quest to build an illuminated, free, and holy society
        </p>

        <blockquote class="scripture">
          <p>
            “Ye are the light of the world. A city that is set on a hill cannot be hid.”
          </p>

          <cite>Matthew 5:14</cite>
        </blockquote>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const lineSelector = ".fitted-title-line";
      const measurementSize = 100;
      const minimumSize = 12;
      const maximumSize = 180;

      function fitLine(line) {
        const targetWidth = line.parentElement.clientWidth;

        if (targetWidth <= 0) {
          return;
        }

        line.style.fontSize = `${measurementSize}px`;

        const naturalWidth = line.scrollWidth;

        if (naturalWidth <= 0) {
          return;
        }

        let calculatedSize =
          measurementSize * (targetWidth / naturalWidth);

        calculatedSize = Math.max(
          minimumSize,
          Math.min(calculatedSize, maximumSize)
        );

        line.style.fontSize = `${calculatedSize}px`;

        /*
          Refinement pass for kerning, word spacing,
          subpixel rendering, and browser rounding.
        */

        const renderedWidth = line.scrollWidth;

        if (renderedWidth > 0) {
          const correction = targetWidth / renderedWidth;
          const correctedSize = calculatedSize * correction;

          line.style.fontSize =
            `${Math.max(
              minimumSize,
              Math.min(correctedSize, maximumSize)
            )}px`;
        }
      }

      function fitAllLines() {
        document.querySelectorAll(lineSelector).forEach(fitLine);
      }

      let resizeFrame;

      function scheduleFit() {
        window.cancelAnimationFrame(resizeFrame);

        resizeFrame = window.requestAnimationFrame(() => {
          fitAllLines();
        });
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(scheduleFit);
      } else {
        window.addEventListener("load", scheduleFit);
      }

      window.addEventListener("resize", scheduleFit);

      const wordmark = document.querySelector(".bilingual-wordmark");

      if ("ResizeObserver" in window && wordmark) {
        const observer = new ResizeObserver(scheduleFit);
        observer.observe(wordmark);
      }
    })();
  </script>
</body>
</html>
