<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Holy City Society</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="site-header site-shell">
    <nav class="top-nav" aria-label="Primary">
      <a href="./index.html" aria-current="page">Praxis</a>
      <a href="./virtues.html">Energeia</a>
    </nav>

    <div class="site-name" aria-label="Holy City Society">
      <span class="site-cross" aria-hidden="true">✠</span>
      <span>Holy City Society</span>
      <span class="site-cross" aria-hidden="true">✠</span>
    </div>
  </header>

  <main class="site-shell">
    <section class="hero" aria-labelledby="formal-title">
      <div
        class="hero-art"
        role="img"
        aria-label="Blue engraved city on a hill with mounted riders"
      ></div>

      <div class="hero-copy">
        <div
          class="bilingual-wordmark"
          aria-label="Societas et Ordo Equestris Civitatis Sanctae. The Society and Equestrian Order of the Holy City."
        >
          <p class="formal-title formal-latin">
            <span class="title-line fitted-title-line">
              Societas et
            </span>

            <span class="title-line fitted-title-line">
              Ordo Equestris
            </span>

            <span class="title-line fitted-title-line">
              Civitatis Sanctae
            </span>
          </p>

          <h1 class="formal-title formal-english" id="formal-title">
            <span class="title-line fitted-title-line">
              The Society &amp;
            </span>

            <span class="title-line fitted-title-line">
              Equestrian Order of
            </span>

            <span class="title-line fitted-title-line">
              The Holy City
            </span>
          </h1>
        </div>

        <p class="mission">
          Continuing the quest to build an illuminated, free, and holy society
        </p>

        <blockquote class="scripture">
          <p>
            “Ye are the light of the world. A city that is set on a hill cannot be hid.”
          </p>

          <cite>Matthew 5:14</cite>
        </blockquote>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const SELECTOR = ".fitted-title-line";

      function getNumericStyle(element, propertyName, fallback) {
        const value = Number.parseFloat(
          getComputedStyle(element).getPropertyValue(propertyName)
        );

        return Number.isFinite(value) ? value : fallback;
      }

      function fitLineToWidth(line) {
        const availableWidth = line.clientWidth;

        if (availableWidth <= 0) {
          return;
        }

        const parentTitle = line.closest(".formal-title");
        const isLatin = parentTitle.classList.contains("formal-latin");

        const minimumSize = getNumericStyle(
          parentTitle,
          "--minimum-line-size",
          isLatin ? 14 : 16
        );

        const maximumSize = getNumericStyle(
          parentTitle,
          "--maximum-line-size",
          isLatin ? 54 : 62
        );

        line.style.fontSize = `${maximumSize}px`;

        let low = minimumSize;
        let high = maximumSize;
        let bestSize = minimumSize;

        for (let iteration = 0; iteration < 24; iteration += 1) {
          const testSize = (low + high) / 2;

          line.style.fontSize = `${testSize}px`;

          const renderedWidth = line.scrollWidth;

          if (renderedWidth <= availableWidth) {
            bestSize = testSize;
            low = testSize;
          } else {
            high = testSize;
          }
        }

        line.style.fontSize = `${bestSize}px`;
      }

      function fitAllWordmarkLines() {
        document.querySelectorAll(SELECTOR).forEach(fitLineToWidth);
      }

      let resizeFrame;

      function scheduleFit() {
        window.cancelAnimationFrame(resizeFrame);

        resizeFrame = window.requestAnimationFrame(() => {
          fitAllWordmarkLines();
        });
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(scheduleFit);
      } else {
        window.addEventListener("load", scheduleFit);
      }

      window.addEventListener("resize", scheduleFit);

      const wordmark = document.querySelector(".bilingual-wordmark");

      if ("ResizeObserver" in window && wordmark) {
        const observer = new ResizeObserver(scheduleFit);
        observer.observe(wordmark);
      }
    })();
  </script>
</body>
</html>
